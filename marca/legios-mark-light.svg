<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Legios">
  <!-- Three branches converging on one node. Geometry matches the org lockup exactly. -->
  <defs>
    <linearGradient id="legios" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="0">
      <stop offset="0" stop-color="#189AB0"/>
      <stop offset="1" stop-color="#1E6EEF"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#legios)" stroke-width="5" stroke-linecap="round" opacity=".75">
    <path d="M9 32 H41"/>
    <path d="M9 14 C26 14 28 32 41 32"/>
    <path d="M9 50 C26 50 28 32 41 32"/>
  </g>
  <circle cx="50" cy="32" r="7.5" fill="url(#legios)"/>
</svg>
